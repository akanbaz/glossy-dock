name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint
        run: ./scripts/lint.sh
      - name: Tag must match the package version
        run: |
          version=$(python3 -c 'import json; print(json.load(open("plasmoid/metadata.json"))["KPlugin"]["Version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match metadata version v$version" >&2
            exit 1
          fi
      - name: Build release files
        run: ./scripts/build.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Glossy Dock $GITHUB_REF_NAME" --notes-file CHANGELOG.md
